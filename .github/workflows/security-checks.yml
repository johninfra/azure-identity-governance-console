name: Static security checks
on:
  push:
    branches: [main, enterprise-security-hardening]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and security invariants
        run: |
          node --check app.js
          node --check live-entra.js
          node --check governance-intelligence.js
          node tests/security-regression.cjs
